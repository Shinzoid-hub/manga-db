<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <section>
        <div class="login_banner">
            <img src="../assets/bg.jpg" class="bg" alt="background">

            <canvas id="smokeCanvas"></canvas>

            <img src="../assets/samurai1.png" class="s-1" alt="s1">
            <img src="../assets/samurai2.png" class="s-2" alt="s2">
        </div>

        <div class="login">
            <a href="../index.html" class="back-btn" title="Back To Home">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h2>Sign In</h2>
            <div class="inputBox">
                <input type="text" placeholder="Username">
            </div>
            <div class="inputBox">
                <input type="password" placeholder="Password">
            </div>
            <div class="inputBox">
                <input type="submit" value="Login" id="btn">
            </div>
            <div class="group">
                <a href="#"> Forget Password </a> <br>
                <a href="#"> Log In </a>
            </div>
        </div>
        <!-- <img src="./png/1240039.png" class="bg" alt="background png"> -->
    </section>

    <script src="login.js"></script>

</body>

</html>
